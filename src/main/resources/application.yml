spring:
  application:
    name: keycloak-bff

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5433}/${APP_DB_NAME:bff_app}?gssEncMode=disable
    username: ${APP_DB_USER:bff}
    password: ${APP_DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      driver-properties:
        timezone: UTC

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000

server:
  port: ${SPRING_PORT:8080}
  servlet:
    context-path: ${BFF_CONTEXT_PATH:/api}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.example.bff: DEBUG

app:
  security:
    session-cookie-name: ${SESSION_COOKIE_NAME:SESSION_ID}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
    session-cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Strict}
  keycloak:
    server-url: ${APP_KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: ${KC_REALM:bff-realm}
    client-id: ${KC_CLIENT_ID:bff-client}
    client-secret: ${KC_CLIENT_SECRET:change_me}
    token-endpoint: /realms/${KC_REALM:bff-realm}/protocol/openid-connect/token
    logout-endpoint: /realms/${KC_REALM:bff-realm}/protocol/openid-connect/logout
    authorize-endpoint: /realms/${KC_REALM:bff-realm}/protocol/openid-connect/auth
    redirect-uri: http://localhost:${SPRING_PORT:8080}${BFF_CONTEXT_PATH:/api}/auth/callback
    dashboard-url: ${DASHBOARD_URL:http://localhost:3000/dashboard}
    admin:
      client-id: ${KC_ADMIN_CLIENT_ID:admin-cli}
      username: ${KC_ADMIN_USER:admin}
      password: ${KC_ADMIN_PASSWORD:admin}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
    dashboard-url: ${DASHBOARD_URL:http://localhost:3000/dashboard}
